<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cup Day Sweep</title>
<meta name="theme-color" content="#083d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cup Sweep">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@75..150,500..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first racebook. A racing-green hero with the Cup and a horse on the rail, next-jump bar,
   you + your horses, live feed, race strip, one race card, standings, organiser tools.
   One high-contrast light theme on purpose: it stays readable outdoors in full sun. Big type for older eyes. */
:root{
  --bg:#e9efea; --surface:#ffffff; --ink:#0b140f; --muted:#344038; --line:#adbcb2;
  --turf:#0b5a33; --turf-deep:#083d24; --turf-soft:#d9eee1;
  --rose:#a90f2b; --rose-soft:#fbe2e7;
  --gold:#e8b923; --gold-ink:#6f4f00; --gold-soft:#fbf0c9;
  --silver:#c9d0d6; --bronze:#d08a4c; --on-solid:#ffffff;
  --cloth:#ffffff; --cloth-ink:#0b140f; --cloth-cup:#a90f2b; --cloth-cup-ink:#ffffff;
  --display:"Anybody","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(40px,11vw,60px);font-weight:900;font-stretch:125%;letter-spacing:-.01em;line-height:.95}
h2{font-size:25px;font-weight:850;font-stretch:115%;color:var(--turf-deep)}
h3{font-size:20px;font-weight:850;font-stretch:110%}
p{margin:0}
b{font-weight:700}
code{font-size:15px;background:var(--bg);padding:1px 6px;border-radius:4px}
.eyebrow{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--turf);font-weight:800}
.muted{color:var(--muted)} .small{font-size:16px} .num{font-variant-numeric:tabular-nums}

/* ---- hero ---- */
.hero{position:relative;overflow:hidden;border-radius:16px;background:var(--turf-deep);color:var(--on-solid);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:20px 18px 0}
.hero .eyebrow{color:var(--gold)}
.hero h1{color:var(--on-solid);grid-column:1}
.hero .trophy{grid-column:2;grid-row:1 / span 3;width:clamp(76px,22vw,112px);height:auto;align-self:start;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.hero .mode{grid-column:1 / -1;color:var(--on-solid)}
.hero .track{grid-column:1 / -1;position:relative;height:96px;margin:2px -18px 0}
.hero .rail{position:absolute;left:0;right:0;bottom:12px;height:4px;background:var(--on-solid)}
.hero .rail::after{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:var(--on-solid);opacity:.45}
.hero .runner{position:absolute;bottom:13px;left:55%;width:132px;height:auto}
@media (prefers-reduced-motion:no-preference){
  .hero .runner{left:0;animation:gallop 11s linear infinite}
  @keyframes gallop{0%{transform:translateX(-150px)}60%{transform:translateX(calc(100vw + 20px))}100%{transform:translateX(calc(100vw + 20px))}}
}
.mode{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:16px;font-weight:600}
.mode span{display:inline-flex;align-items:center;gap:7px}
.dot{width:11px;height:11px;border-radius:50%;background:#c7d1ca}
.dot.on{background:#57e08f} .dot.off{background:#ff8fa3}
.alertbtn{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:800}
.alerts-on{font-weight:600}

/* ---- panels ---- */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px;min-width:0}
.panel.me{border-color:var(--turf);border-width:3px}
.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}

/* ---- controls: big, obvious, easy to hit ---- */
button{font:inherit;font-size:18px;cursor:pointer;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;font-weight:700;min-height:52px}
button:hover{border-color:var(--turf)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--turf);border-color:var(--turf);color:var(--on-solid)}
button.big{font-family:var(--display);font-size:23px;font-weight:850;font-stretch:110%;padding:16px 20px;width:100%;min-height:64px}
button.danger{background:var(--rose);border-color:var(--rose);color:var(--on-solid)}
button.ghost{border:none;background:none;padding:8px 10px;min-height:44px;color:var(--rose);font-weight:700;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
input,select,textarea{font:inherit;font-size:18px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:9px;padding:11px 12px;min-width:0;min-height:52px}
select{font-weight:700}
textarea{width:100%;font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace}
label.f{display:grid;gap:6px;font-size:15px;color:var(--muted);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row label.f{flex:1 1 120px}
.whoami{display:grid;gap:6px;width:100%;font-size:17px;font-weight:800;color:var(--ink)}
.whoami select{width:100%;font-size:20px}
.whoami.need select{border:3px solid var(--gold);background:var(--gold-soft)}

/* ---- lists ---- */
.list{display:grid}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1.5px solid var(--line)}
.li:last-child{border-bottom:none}
.li .main{min-width:0;display:grid;gap:2px}
.li .main b{overflow-wrap:anywhere;font-size:19px}
button.li{border:none;border-bottom:1.5px solid var(--line);border-radius:0;background:none;text-align:left;min-height:0;padding:12px 0;width:100%;font-weight:400}
.amt{font-family:var(--display);font-weight:850;font-size:22px;white-space:nowrap}
.pos-net{color:var(--turf)} .neg-net{color:var(--rose)}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tot{background:var(--bg);border-radius:10px;padding:12px 10px;display:grid;gap:2px}
.tot span{font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tot b{font-family:var(--display);font-size:28px;font-weight:900}
.sub{font-size:16px;color:var(--muted);text-align:center;font-weight:600}

/* ---- race strip ---- */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:grid;justify-items:center;gap:2px;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);min-width:72px;min-height:64px}
.chip b{font-family:var(--display);font-size:22px;font-weight:900;font-stretch:110%}
.chip span{font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:800}
.chip.sel{border-color:var(--turf-deep);background:var(--turf-deep);color:var(--on-solid)}
.chip.sel span,.chip.sel .done{color:var(--gold)}
.chip.cup{border-color:var(--gold)}
.chip.cup b{color:var(--rose)}
.chip.cup.sel b{color:var(--gold)}
.chip.off{opacity:.45}
.chip .done{color:var(--turf)}

/* ---- race card ---- */
.racehead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.racehead h2{font-size:clamp(28px,7.5vw,38px);font-stretch:120%;color:var(--ink)}
.pot{text-align:right}
.pot b{display:block;font-family:var(--display);font-size:38px;font-weight:900;line-height:1}
.pill{display:inline-block;font-size:14px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:99px;background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.pill.open{background:var(--turf);color:var(--on-solid);border-color:var(--turf)}
.pill.res{background:var(--rose);color:var(--on-solid);border-color:var(--rose)}
.ids{display:flex;gap:8px;align-items:center}
.cloth{width:48px;height:48px;display:grid;place-items:center;background:var(--cloth);color:var(--cloth-ink);font-family:var(--display);font-weight:900;font-size:24px;border:2px solid var(--ink);border-radius:6px;flex:0 0 auto}
.cloth.c{background:var(--cloth-cup);color:var(--cloth-cup-ink);border-color:var(--cloth-cup)}
.silk{width:46px;height:52px;flex:0 0 auto;display:block}
.silk-blank{width:46px;height:52px;border:2px dashed var(--line);border-radius:6px;flex:0 0 auto}
.rn.scr{opacity:.55}
.rn.scr .hname{text-decoration:line-through}
.owner{font-size:16.5px;color:var(--muted)}
.owner b{color:var(--ink);font-size:inherit}
.rn.mine{background:var(--turf-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:10px}
.rn.mine .owner b{color:var(--turf)}
.owner.free{color:var(--turf);font-weight:800}
.jock{font-size:15.5px;color:var(--muted);overflow-wrap:anywhere}
.odds{font-family:var(--display);font-weight:850;font-size:19px;white-space:nowrap}
.side{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.place{font-family:var(--display);font-weight:900;font-size:16px;padding:4px 9px;border-radius:7px;color:var(--ink);white-space:nowrap;border:2px solid rgba(0,0,0,.25)}
.p1{background:var(--gold)} .p2{background:var(--silver)} .p3{background:var(--bronze)}
.tog{font-size:15px;padding:8px 12px;min-height:44px}
.pickbox{display:grid;gap:12px;padding:16px;border-radius:12px;background:var(--turf-soft);border:2px solid var(--turf)}
.reveal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:16px;border-radius:12px;border:3px solid var(--turf);background:var(--surface)}
.reveal .big-ids{display:flex;gap:8px}
.reveal .big-ids .cloth{width:64px;height:64px;font-size:32px}.reveal .big-ids .silk,.reveal .big-ids .silk-blank{width:64px;height:72px}
.reveal h3{font-size:24px}
@media (prefers-reduced-motion:no-preference){.reveal{animation:pop .5s ease-out}@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:none;opacity:1}}}
.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--rose-soft);border:2px solid var(--rose);border-radius:10px;font-weight:600}
.warn{font-size:16px;color:var(--rose);font-weight:700}
.note{font-size:16.5px;padding:12px 14px;border-radius:10px;background:var(--gold-soft);color:var(--ink);border:2px solid var(--gold);font-weight:600}
details.tools{border-top:2px dashed var(--line);padding-top:12px}
details>summary{cursor:pointer;font-weight:800;color:var(--turf);padding:8px 0;font-size:18px;min-height:44px}
.tools-body{display:grid;gap:16px;margin-top:10px}
.ftable{overflow-x:auto}
.ftable table{border-collapse:collapse;width:100%;min-width:620px;font-size:16px}
.ftable th{text-align:left;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 4px}
.ftable td{padding:4px;vertical-align:middle}
.ftable input{width:100%;padding:8px 9px;font-size:16px;min-height:44px}
.ftable td.n{font-family:var(--display);font-weight:900;width:38px;font-size:20px}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:4px;padding:6px 6px 6px 14px;border-radius:99px;background:var(--bg);border:2px solid var(--line);font-weight:700}
.pchip button{border:none;background:none;padding:0 10px;min-height:40px;color:var(--rose);font-size:22px;line-height:1}
.rules{margin:0;padding-left:22px;display:grid;gap:10px;font-size:17.5px;max-width:65ch}
.flash{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--on-solid);text-align:center;font-size:18px;font-weight:700}
.cloth.taken{position:relative;opacity:.45;text-decoration:line-through;text-decoration-thickness:3px}
.cloth.taken::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:3px;background:var(--rose);transform:rotate(-40deg)}
.mygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mycard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.mycard .big-ids{display:flex;gap:6px}
.mycard .hname{font-size:19px}
.mycard.fresh{border:3px solid var(--turf);background:var(--turf-soft)}
.mycard.scr{opacity:.55}
.mycard.scr .hname{text-decoration:line-through}
@media (prefers-reduced-motion:no-preference){.mycard.fresh{animation:pop .5s ease-out}}
.banner{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;background:var(--rose);color:var(--on-solid);font-weight:800;font-size:19px}
.banner .ghost{color:var(--on-solid);font-size:24px;text-decoration:none}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(5,12,8,.72);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.popup{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;display:grid;gap:14px;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;border-top:10px solid var(--gold)}
.popup h2{font-size:30px;font-stretch:120%;color:var(--ink)}
.youwon{background:var(--turf);color:var(--on-solid);border-radius:12px;padding:14px 16px;font-family:var(--display);font-size:24px;font-weight:900}
.youwon b{font-size:34px;color:var(--gold)}
.youwon.close{background:var(--gold-soft);color:var(--ink);border:2px solid var(--gold)}
.youwon.close b{color:var(--gold-ink)}
@media (prefers-reduced-motion:no-preference){.popup{animation:pop .45s ease-out}}
.resultpad{display:grid;gap:14px;padding:16px;border-radius:12px;border:3px solid var(--gold);background:var(--gold-soft)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:grid;gap:4px;justify-items:start;padding:10px;border-radius:10px;border:2px dashed var(--line);background:var(--surface);min-width:0}
.slot b{font-size:20px}
.slot.next{border:3px solid var(--turf)}
.slot.set{border-style:solid}
.slot .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.padgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.padkey{position:relative;display:grid;justify-items:center;gap:4px;padding:10px 6px;min-height:110px;border-radius:12px}
.padkey .cloth{width:52px;height:52px;font-size:26px}
.padkey.on{border:3px solid var(--turf);background:var(--turf-soft)}
.padkey .place{position:absolute;top:5px;right:5px;font-size:13px;padding:2px 6px}
.padname{font-size:14px;font-weight:700;line-height:1.2;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
.padown{font-size:13px;color:var(--muted);line-height:1.15;font-weight:600}
.ticker{display:grid;gap:3px;justify-items:start;text-align:left;width:100%;padding:14px 18px;border-radius:14px;border:3px solid var(--ink);background:var(--gold);color:var(--ink)}
.ticker .eyebrow{color:var(--ink)}
.ticker b{font-family:var(--display);font-size:25px;font-weight:900;font-stretch:115%;line-height:1.15}
.ticker .small{font-weight:700}
.ticker.soon{background:var(--rose);color:var(--on-solid);border-color:var(--rose)}
.ticker.soon .eyebrow{color:var(--on-solid)}
@media (prefers-reduced-motion:no-preference){.ticker.soon{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{filter:brightness(1.15)}}}
.feed{display:grid}
.feeditem{display:flex;justify-content:space-between;gap:12px;align-items:baseline;text-align:left;width:100%;border:none;border-bottom:1.5px solid var(--line);border-radius:0;background:none;padding:11px 0;min-height:0;font-weight:400;font-size:17px}
.feeditem:last-child{border-bottom:none}
.feeditem span:first-child{min-width:0;overflow-wrap:anywhere}
.feeditem span:last-child{white-space:nowrap;flex:0 0 auto}
.feeditem.win{font-weight:700;color:var(--turf)}
.tag{display:inline-block;font-size:13.5px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:99px;vertical-align:2px}
.tag.fav{background:var(--gold);color:var(--ink)}
.tag.roughie{background:var(--rose);color:var(--on-solid)}
.badge{display:inline-block;font-size:16px;font-weight:700;font-family:var(--body);margin-left:3px;white-space:nowrap}
.wrapped{border:3px solid var(--gold);background:var(--gold-soft)}
.wrapped h2{color:var(--ink)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wcard{display:grid;gap:4px;padding:14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);min-width:0}
.wcard b{font-family:var(--display);font-size:24px;font-weight:900;overflow-wrap:anywhere}
.wcard.you{border:3px solid var(--turf)}
.settle{border:3px solid var(--gold);background:var(--gold-soft)}
.settle h2{color:var(--ink)}
.settle-amt{font-size:30px}
.payid{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:10px 10px 10px 16px}
.payid span{font-family:var(--display);font-size:30px;font-weight:900;letter-spacing:.03em;flex:1 1 auto;user-select:all;-webkit-user-select:all}
.settle-done{font-size:20px;font-weight:800;color:var(--turf)}
.settle-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.oddsbox{display:grid;justify-items:end;line-height:1.15}
.plodds{font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
.sumnote{font-weight:600;color:var(--muted);font-size:15px;margin-left:4px}
.oddsgrid{display:grid;grid-template-columns:auto minmax(0,1fr) 88px 88px;gap:8px 10px;align-items:center}
.oddsgrid .oh{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.oddsgrid .oname{font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.oddsgrid input{width:100%;text-align:center;font-family:var(--display);font-weight:850;font-size:21px;padding:8px 4px}
.oddsgrid input:placeholder-shown{background:var(--gold-soft);border-color:var(--gold)}
@media (max-width:420px){.oddsgrid{grid-template-columns:auto minmax(0,1fr) 74px 74px;gap:8px 6px}.oddsgrid input{font-size:19px}}
.empty{padding:16px;border:2px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted);font-size:17px;font-weight:600}
@media (max-width:480px){.results{grid-template-columns:1fr}.pot{text-align:left}.totals{gap:6px}.tot b{font-size:23px}.slots{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.chip,button{transition:border-color .15s,background .15s}}
</style>

  // ---------- alerts ----------
  let alertsOn = LS.get('cupsweep.alerts') === '1', actx = null, banner = '';
  const AC = window.AudioContext || window.webkitAudioContext;
  function chime(){
    try {
      if (!actx) return; actx.resume();
      const t = actx.currentTime;
      [880, 1320, 1760].forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + i*0.16); g.gain.exponentialRampToValueAtTime(0.3, t + i*0.16 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.16 + 0.4);
        o.connect(g); g.connect(actx.destination); o.start(t + i*0.16); o.stop(t + i*0.16 + 0.45);
      });
    } catch(_) {}
  }
  function notify(text, withBanner){
    if (!alertsOn) return;
    chime();
    try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch(_) {}
    try { if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification('Cup Day Sweep', { body: text }); } catch(_) {}
    if (withBanner){ banner = text; render(); }
  }
  function enableAlerts(){

  document.addEventListener('pointerdown', () => { if (!alertsOn || !AC) return; try { if (!actx) actx = new AC(); actx.resume(); } catch(_) {} }, { passive: true });
  function checkReminders(){
    if (!S || !S.races.length) return;
    const now = Date.now();
    S.races.forEach(r => {
      const ts = startTs(r); if (!r.on || !ts || isClosed(r)) return;
      const mins = (ts - now) / 60000, k = 'cupsweep.remind.' + SWEEP_ID + '.' + r.id + '.' + ts;

        LS.set(k, '1');

      }
    });
  }
  let lastAnnounced = null;
  function checkAnnouncements(){
    const cur = {}; S.races.forEach(r => cur[r.id] = r.announced);

      if (fresh) notify(`Result in for ${fresh.name}.`, false);
    } else {
      // First load: don't replay every old result, only the most recent unseen one.
      const due = S.races.filter(r => r.announced && +(LS.get(seenKey(r.id)) || 0) < r.announced).sort((a,b) => b.announced - a.announced);

    }
    lastAnnounced = cur;
  }

    const okSplit = r.split.reduce((a,b) => a+(+b||0), 0) === 100;

  function renderOddsEditor(r){
    if (!r.on || !r.field.length) return '';

  // "1 3.50 1.40", "1, Royal Press, $3.50, $1.40" or "1	Royal Press	3.5	1.4": the last two prices on the line are win then place.
  function parseOdds(text, r){
    const out = [];
    String(text||'').split(/\r?\n/).forEach(line => {
      const m = line.match(/^\s*(\d{1,2})\b(.*)$/); if (!m) return;
      const n = +m[1]; if (!horse(r, n)) return;
      const nums = (m[2].match(/\$?\d+(?:\.\d+)?/g) || []).map(v => v.replace('$','')).filter(v => +v >= 1.01 && +v < 1000);
      if (!nums.length) return;
      const [w, p] = nums.length >= 2 ? nums.slice(-2) : [nums[0], ''];
      out.push({ n, w, p });
    });
    return out;
  }

  function renderSettleMe(C, me){
    const net = netOf(C, me), done = settledOk(C, me), isHost = me === S.meta.orgPid;
    let h = `<section class="panel settle"><span class="eyebrow">Settle up</span>`;
    if (isHost){
      return h + `<h2>You’re holding the money</h2><p>Your own result: ${net>=0?'up':'down'} <b class="num">${money(Math.abs(net))}</b>. The organiser list below shows who pays you and who you pay.</p></section>`;
    }
    if (net < 0){
      h += `<h2 class="settle-amt">You owe <span class="num neg-net">${money(-net)}</span></h2>`;
      if (done) return h + `<p class="settle-done">✓ ${esc(orgName())} has received it. Thanks!</p></section>`;
      h += `<p>Pay ${esc(orgName())} by PayID from your banking app:</p>
        <div class="payid"><span class="num" id="payid-text">${esc(payidPretty())}</span><button class="primary" data-act="copy-payid">Copy</button></div>
        <p class="small">Description: <b>Cup sweep ${esc((player(me)||{}).name||'')}</b></p>`;
    } else if (net > 0){
      h += `<h2 class="settle-amt">You’re owed <span class="num pos-net">${money(net)}</span></h2>`;
      h += done ? `<p class="settle-done">✓ ${esc(orgName())} has sent it to you.</p>` : `<p>${esc(orgName())} will send it to you. Make sure they have your PayID or bank details.</p>`;
    } else {
      h += `<h2 class="settle-amt">You’re square</h2><p>You broke even, so there’s nothing to pay or receive.</p>`;
    }
    return h + `</section>`;
  }

  function renderSettleOrg(C){
    const people = S.players.filter(p => p.id !== S.meta.orgPid).map(p => ({ p, net: netOf(C, p.id), ok: settledOk(C, p.id), stale: S.settled[p.id] != null && !settledOk(C, p.id) }));
    const pay = people.filter(x => x.net < 0).sort((a,b) => a.net - b.net), get = people.filter(x => x.net > 0).sort((a,b) => b.net - a.net), even = people.filter(x => x.net === 0);
    const inT = cents(pay.reduce((s,x) => s - x.net, 0)), outT = cents(get.reduce((s,x) => s + x.net, 0));
    const inDone = cents(pay.filter(x => x.ok).reduce((s,x) => s - x.net, 0)), outDone = cents(get.filter(x => x.ok).reduce((s,x) => s + x.net, 0));
    const host = player(S.meta.orgPid), hostNet = host ? netOf(C, host.id) : 0;
    const leftover = cents(-S.players.reduce((s,p) => s + netOf(C, p.id), 0));
    const row = (x, verb) => `<div class="li"><span></span><span class="main"><b>${esc(x.p.name)}</b>${x.stale ? '<span class="warn">Amount changed since you ticked it</span>' : ''}</span><span class="side"><span class="amt num">${money(Math.abs(x.net))}</span><button class="tog ${x.ok?'primary':''}" data-act="settle" data-id="${esc(x.p.id)}" aria-pressed="${x.ok}">${x.ok ? '✓ Done' : verb}</button></span></div>`;
    let h = `<section class="panel"><div class="head"><h2>Settle up</h2></div>`;
    h += `<div class="row"><button class="${S.meta.settle?'':'primary'}" data-act="settle-open">${S.meta.settle ? 'Hide settle up from players' : 'Show settle up to everyone'}</button><span class="small muted">${S.meta.settle ? 'Players can see what they owe or are owed.' : 'Turn this on after the last race. Each phone then shows what to pay or receive.'}</span></div>`;
    h += `<div class="row"><label class="f">Your PayID<input id="payid" data-f2="payid" value="${esc(payid())}" inputmode="tel"></label><label class="f">You are<select id="org-pid" data-f2="orgPid"><option value="">Choose your name</option>${S.players.map(p => `<option value="${esc(p.id)}" ${p.id===S.meta.orgPid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label></div>`;
    h += `<div class="settle-sum"><div class="tot"><span>To collect</span><b class="num">${money(inT)}</b><span class="small">${money(inDone)} received</span></div><div class="tot"><span>To pay out</span><b class="num">${money(outT)}</b><span class="small">${money(outDone)} sent</span></div></div>`;
    h += `<h3>Pay you</h3>` + (pay.length ? `<div class="list">${pay.map(x => row(x, 'Got it')).join('')}</div>` : `<p class="muted small">Nobody owes you.</p>`);
    h += `<h3>You pay</h3>` + (get.length ? `<div class="list">${get.map(x => row(x, 'Sent')).join('')}</div>` : `<p class="muted small">Nobody is owed money.</p>`);
    if (even.length) h += `<p class="small muted">Square: ${even.map(x => esc(x.p.name)).join(', ')}</p>`;
    // Money in races with no result yet is still in play, not lost.
    const inPlay = cents(S.races.filter(r => r.on && !r.res[0]).reduce((s,r) => { const i = C.info[r.id]; return s + (i && (i.counted || i.jin) ? i.pot : 0); }, 0));
    const lost = cents(leftover - inPlay);
    if (inPlay > 0.005) h += `<p class="note">${money(inPlay)} is still riding on races that haven’t run, so these amounts will change. Show settle up after the last result.</p>`;
    if (host) h += `<p class="small">Your own result: ${hostNet>=0?'up':'down'} <b class="num">${money(Math.abs(hostNet))}</b>. You don’t pay yourself, so once everyone’s collected and paid, you’ll finish ${hostNet>=0?'up':'down'} by that amount.</p>`;
    else h += `<p class="warn">Choose your name under “You are” so you’re left off the lists.</p>`;
    if (lost > 0.005) h += `<p class="note">${money(lost)} wasn’t won by anyone. A jackpot had no later race to move to. Share it however the group likes.</p>`;
    return h + `</section>`;
  }

  function renderOrgLogin(){
    if (isOrg) return `<section class="panel"><div class="head"><h2>Organiser</h2><button data-act="lock">Lock organiser mode</button></div><p class="small muted">Players use the same link without the PIN. Sweep: <code>${esc(SWEEP_ID)}</code></p></section>`;
    return `<details class="panel"><summary>Organiser login</summary><form class="row" data-form="login" style="margin-top:10px"><label class="f">PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off" value="${esc(pinText)}"></label><button type="submit">Unlock</button></form></details>`;
  }

  function parseField(text){
    const out = [];
    String(text||'').split(/\r?\n/).forEach(line => {
      const parts = line.split(/\t|,|\|/).map(s => s.trim());
      const n = parseInt(parts[0], 10);
      if (!n || n < 1 || n > 40) return;
      out.push({ n, name: norm(parts[1]), j: norm(parts[2]), odds: norm(String(parts[3]||'').replace(/^\$/,'')), c: parts.slice(4).filter(Boolean).join(', ').replace(/\s+/g,' ').trim().slice(0,120) });
    });
    const seen = new Set(); return out.filter(x => !seen.has(x.n) && seen.add(x.n));
  }

  // Racing Australia fields page, copied with Ctrl+A / Ctrl+C. Each race has a runner table
  // (tab-separated, header row contains "Horse") followed by one detail block per horse that
  // starts with "<number><HORSE NAME>" and holds "Colours:" and "Jockey: … Barrier:" lines.
  function parseRA(text){
    const clean = s => String(s||'').replace(/\s*VOBIS.*$/i,'').replace(/\s+-\s+.*$/,'').trim();
    const nkey = s => clean(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
    const title = s => clean(s).toLowerCase().replace(/(^|[\s(\-])([a-z])/g, (m,a,b) => a + b.toUpperCase()).replace(/\(([a-z]+)\)/gi, (m,a) => '(' + a.toUpperCase() + ')');
    const races = []; let cur = null, header = null, det = null;
    String(text||'').split(/\r?\n/).forEach(raw => {
      const line = raw.replace(/ /g,' ');
      let m = line.match(/^\s*Race\s+(\d+)\s*-\s*(.+?)\s*(\(\s*[\d,]+\s*METRES?\s*\))?\s*$/i);
      if (m){ cur = { n:+m[1], name:m[2].trim(), rows:[], det:{} }; races.push(cur); header = null; det = null; return; }
      if (!cur) return;
      const cells = line.split('\t');
      if (cells.length > 2 && cells.some(c => c.trim().toLowerCase() === 'horse')){ header = cells.map(c => c.trim().toLowerCase()); return; }
      if (header && cells.length > 2 && /^\d+$/.test(cells[0].trim())){
        const hi = header.indexOf('horse'), ji = header.findIndex(c => c.startsWith('jockey'));
        if (hi >= 0 && cells[hi]) cur.rows.push({ n:+cells[0].trim(), raw:cells[hi], j: ji >= 0 ? norm(cells[ji]) : '' });
        return;
      }
      if (cells.length === 1 && /^\d+[A-Z]/.test(line.trim())){ det = {}; cur.det[nkey(line.trim().replace(/^\d+/,''))] = det; return; }
      if (!det) return;
      m = line.match(/^\s*Colours:\s*(.+)$/i); if (m){ det.c = m[1].replace(/\s+/g,' ').trim(); return; }
      m = line.match(/Jockey:\s*(.*?)\s*Barrier:/i); if (m && m[1].trim()) det.j = norm(m[1]);
    });
    return races.filter(r => r.rows.length).map(r => ({
      n: r.n, name: r.name,
      field: r.rows.map(x => { const d = r.det[nkey(x.raw)] || {}; return { n:x.n, name:title(x.raw), j: x.j || d.j || '', odds:'', c: (d.c || '').slice(0,120) }; })
    }));
  }

  // ---------- events ----------
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || !S) return;
    const act = b.dataset.act, r = race(sel);
    if (act === 'sel'){ sel = +b.dataset.id; LS.set('cupsweep.sel.'+SWEEP_ID, String(sel)); confirmKey = null; pasteText = ''; if (reveal && reveal.race !== sel) reveal = null; render(); const s = document.querySelector('.strip'); if (s) window.scrollTo({ top: s.getBoundingClientRect().top + window.scrollY - 10, behavior: 'smooth' }); return; }
    if (act === 'pick'){ const who = isOrg ? pickFor : meId; if (who && r) pickHorse(r, who); return; }
    if (act === 'cancel'){ confirmKey = null; render(); return; }
    if (act === 'alerts'){ enableAlerts(); return; }
    if (act === 'copy-payid'){
      const txt = payid().replace(/\s+/g,'');
      const fallback = () => { const el = document.getElementById('payid-text'); if (el){ const rg = document.createRange(); rg.selectNodeContents(el); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); } say('Press and hold the number to copy it.'); };
      try { navigator.clipboard.writeText(txt).then(() => say('PayID copied. Paste it in your banking app.'), fallback); } catch(_) { fallback(); }
      return;
    }
    if (act === 'banner-x'){ banner = ''; render(); return; }
    if (act === 'pop-x'){
      LS.set(seenKey(b.dataset.id), b.dataset.at);
      // Move on to the next race that's still taking picks, or the next one waiting on a result.
      const nx = S.races.find(x => x.on && x.field.length && !isClosed(x)) || S.races.find(x => x.on && !x.res[0]);
      if (nx){ sel = nx.id; LS.set('cupsweep.sel.'+SWEEP_ID, String(sel)); reveal = null; }
      render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    }
    if (act === 'wrapped' && isOrg){ save({ 'meta/wrapped': S.meta.wrapped ? null : TS }, S.meta.wrapped ? 'Wrapped hidden' : 'Cup Day Wrapped is showing on every phone'); return; }
    if (!isOrg) return;
    if (act === 'ra-read'){ importPreview = parseRA(importText); render(); return; }
    if (act === 'ra-clear'){ importText = ''; importPreview = null; render(); return; }
    if (act === 'ra-load'){
      if (!importPreview || !importPreview.length) return;
      const u = {}; let loaded = 0;
      importPreview.forEach(r => {
        const ex = race(r.n);
        if (ex && Object.keys(ex.picks).length) return;
        const obj = {}; r.field.forEach(x => { obj[x.n] = { name:x.name, j:x.j, odds:'', c:x.c, scr:false }; });
        u[`races/${r.n}/field`] = obj;
        u[`races/${r.n}/name`] = r.name;
        if (!ex){ u[`races/${r.n}/on`] = true; u[`races/${r.n}/price`] = 2; u[`races/${r.n}/split`] = {p1:60,p2:30,p3:10}; }
        loaded++;
      });
      importText = ''; importPreview = null;
      save(u, `Loaded ${loaded} race${loaded===1?'':'s'} from Racing Australia`);
      return;
    }
    if (act === 'lock'){ isOrg = false; LS.set('cupsweep.pin.'+SWEEP_ID, null); render(); return; }
    if (act === 'rmp'){
      const id = b.dataset.id, has = S.races.some(x => Object.values(x.picks).some(pk => pk.pid === id));
      if (has){ confirmKey = 'rmp:'+id; render(); return; }
      save({ ['players/'+id]: null }, 'Player removed'); return;
    }
    if (act === 'rmp-yes'){ confirmKey = null; save({ ['players/'+b.dataset.id]: null }, 'Player removed'); return; }
    if (act === 'scr'){ const hz = horse(r, b.dataset.n); if (!hz) return; const u = { [`races/${r.id}/field/${hz.n}/scr`]: !hz.scr }; if (!hz.scr) PK.forEach((k,i) => { if (r.res[i] === hz.n) u[`races/${r.id}/res/${k}`] = null; }); save(u, `No. ${hz.n} ${hz.scr?'back in':'scratched'}`); }
    else if (act === 'close'){
      const shut = isClosed(r);
      save(shut ? { [`races/${r.id}/closed`]: false, [`races/${r.id}/override`]: byTime(r) } : { [`races/${r.id}/closed`]: true, [`races/${r.id}/override`]: false }, shut ? `Picks reopened for ${r.name}` : `Picks closed for ${r.name}`);
    }
    else if (act === 'rtap'){
      const n = +b.dataset.n, arr = r.res.slice(), at = arr.indexOf(n);
      if (at >= 0) arr[at] = null;
      else { const j = arr.indexOf(null); if (j < 0){ say('All three places are filled. Tap one to remove it first.'); return; } arr[j] = n; }
      const u = { [`races/${r.id}/closed`]: true };
      PK.forEach((k,i) => u[`races/${r.id}/res/${k}`] = arr[i] || null);
      save(u, at >= 0 ? `No. ${n} removed` : `No. ${n} ${PL[arr.indexOf(n)]}`);
    }
    else if (act === 'rclear') save({ [`races/${r.id}/res`]: null, [`races/${r.id}/announced`]: null }, 'Result cleared');
    else if (act === 'announce'){ if (r.res[0]) save({ [`races/${r.id}/announced`]: TS }, `Result announced for ${r.name}`); }
    else if (act === 'paste'){
      const f = parseField(pasteText);
      if (!f.length){ say('No lines started with a horse number.'); return; }
      const obj = {}; f.forEach(x => { const old = horse(r, x.n); obj[x.n] = { name:x.name, j:x.j, odds:x.odds, c:x.c, scr: !!(old && old.scr) }; });
      pasteText = ''; save({ [`races/${r.id}/field`]: obj }, `Loaded ${f.length} horses into ${r.name}`);
    }
    else if (act === 'gen'){
      const el = document.getElementById('gen-n'), n = Math.min(30, Math.max(2, parseInt(el && el.value, 10) || 0));
      if (!el || !el.value) return;
      const obj = {}; for (let i=1;i<=n;i++){ const o = horse(r,i); obj[i] = o ? { name:o.name, j:o.j, odds:o.odds, c:o.c, scr:o.scr } : { name:'', j:'', odds:'', c:'', scr:false }; }
      save({ [`races/${r.id}/field`]: obj }, `${r.name} has ${n} runners`);
    }
    else if (act === 'odds-paste'){
      const got = parseOdds(oddsPaste, r);
      if (!got.length){ say('No lines started with a horse number followed by a price.'); return; }
      const u = { [`races/${r.id}/oddsAt`]: TS };
      got.forEach(x => { u[`races/${r.id}/field/${x.n}/odds`] = x.w; if (x.p) u[`races/${r.id}/field/${x.n}/pl`] = x.p; });
      oddsPaste = ''; save(u, `Odds loaded for ${got.length} horse${got.length===1?'':'s'}`);
    }
    else if (act === 'odds-clear'){
      const u = {}; r.field.forEach(x => { u[`races/${r.id}/field/${x.n}/odds`] = ''; u[`races/${r.id}/field/${x.n}/pl`] = ''; });
      save(u, `Odds cleared for ${r.name}`);
    }
    else if (act === 'askclear'){ confirmKey = 'clear'; render(); }
    else if (act === 'clearpicks'){ confirmKey = null; save({ ['picks/'+r.id]: null, [`races/${r.id}/res`]: null }, `Picks cleared for ${r.name}`); }
    else if (act === 'settle'){ const id = b.dataset.id, C = compute(), on = settledOk(C, id); save({ ['settled/'+id]: on ? null : Math.abs(netOf(C, id)) }, on ? 'Unticked' : 'Ticked off'); }
    else if (act === 'settle-open'){ const u = { 'meta/settle': S.meta.settle ? null : TS }; if (!S.meta.orgPid && player(meId)) u['meta/orgPid'] = meId; save(u, S.meta.settle ? 'Settle up hidden' : 'Settle up is showing on every phone'); }
  });

  root.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'new-player') newPlayer = e.target.value;
    else if (id === 'paste') pasteText = e.target.value;
    else if (id === 'pin') pinText = e.target.value;
    else if (id === 'ra-text') importText = e.target.value;
    else if (id === 'odds-paste') oddsPaste = e.target.value;
  });

  root.addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target.dataset.form;
    if (form === 'addp' && isOrg){
      const nm = norm(newPlayer); newPlayer = '';
      if (!nm){ render(); return; }
      if (S.players.some(p => p.name.toLowerCase() === nm.toLowerCase())){ say(`${nm} is already on the list.`); return; }
      const ref = db.ref(BASE + '/players').push();
      save({ ['players/'+ref.key]: { name: nm } }, `${nm} added`);
      return;
    }
    if (form === 'login' || form === 'setup'){
      const pin = pinText.trim();
      if (pin.length < 4){ say('Use a PIN of at least 4 digits.'); return; }
      const hsh = await hashPin(pin);
      if (S.meta.pinHash && S.meta.pinHash !== hsh){ say('That PIN isn’t right.'); return; }
      isOrg = true; LS.set('cupsweep.pin.'+SWEEP_ID, hsh); pinText = '';
      const u = {};
      if (!S.meta.pinHash) u['meta/pinHash'] = hsh;
      if (!S.races.length) u['races'] = defaultRaces();
      if (Object.keys(u).length) await save(u, 'Organiser mode on'); else say('Organiser mode on');
    }
  });

  root.addEventListener('change', e => {
    const t = e.target; if (!S) return;
    const r = race(sel);
    if (t.id === 'me-pick'){ meId = t.value; LS.set('cupsweep.me.'+SWEEP_ID, meId || null); reveal = null; render(); return; }
    if (t.id === 'pick-for'){ pickFor = t.value; reveal = null; render(); return; }
    if (isOrg && t.dataset.f2){ const v = t.dataset.f2 === 'payid' ? String(t.value).replace(/[^\d@.a-z+\- ]/gi,'').trim().slice(0,60) : t.value; save({ ['meta/'+t.dataset.f2]: v || null }, 'Saved'); return; }
    if (!isOrg || !r) return;
    if (t.dataset.f){
      const f = t.dataset.f; let v;
      if (f === 'price') v = Math.max(0, Math.round((+t.value||0)*100)/100);
      else if (f === 'on') v = t.value === '1';
      else { v = norm(t.value); if (f === 'name' && !v) v = 'Race '+r.id; }
      save({ [`races/${r.id}/${f}`]: v }, `${r.name} updated`);
    } else if (t.dataset.split){
      save({ [`races/${r.id}/split/${PK[+t.dataset.split]}`]: Math.max(0, Math.min(100, Math.round(+t.value||0))) }, 'Prize split updated');
    } else if (t.dataset.res){
      const i = +t.dataset.res, v = t.value ? +t.value : null, u = { [`races/${r.id}/res/${PK[i]}`]: v };
      if (v){ PK.forEach((k,j) => { if (j !== i && r.res[j] === v) u[`races/${r.id}/res/${k}`] = null; }); u[`races/${r.id}/closed`] = true; }
      save(u, `${r.name} result updated`);
    } else if (t.dataset.odd){
      const v = String(t.value).replace(/[$\s]/g,'').replace(/[^\d./]/g,'').slice(0,8);
      if (v !== t.value) t.value = v;
      save({ [`races/${r.id}/field/${t.dataset.n}/${t.dataset.odd}`]: v, [`races/${r.id}/oddsAt`]: TS });
    } else if (t.dataset.fe){
      const f = t.dataset.fe; let v = f === 'c' ? String(t.value).replace(/\s+/g,' ').trim().slice(0,120) : norm(t.value); if (f === 'odds') v = v.replace(/^\$/,'');
      save({ [`races/${r.id}/field/${t.dataset.n}/${f}`]: v }, `No. ${t.dataset.n} updated`);
    }
  });

  // Every 20 seconds: race-time reminders, and redraw so races close on time.
  setInterval(() => { if (!S) return; checkReminders(); if (editing()) pendingRender = true; else render(); }, 20000);

  root.addEventListener('keydown', e => {
    const t = e.target; if (e.key !== 'Enter' || !t.dataset || !t.dataset.odd) return;
    e.preventDefault();
    const all = [...root.querySelectorAll('input[data-odd]')], i = all.indexOf(t);
    if (all[i+1]){ all[i+1].focus(); all[i+1].select(); } else t.blur();
  });

  root.addEventListener('focusout', () => { setTimeout(() => { if (pendingRender && !editing()) render(); }, 50); });

  // ---------- live data ----------
  db.ref('.info/connected').on('value', s => { connected = !!s.val(); if (loaded && !editing()) render(); });
  db.ref(BASE).on('value', async snap => {
    S = normalize(snap.val());
    if (!loaded){
      loaded = true;
      const saved = LS.get('cupsweep.pin.'+SWEEP_ID);
      isOrg = !!(saved && S.meta.pinHash && saved === S.meta.pinHash);
    } else if (isOrg && S.meta.pinHash && LS.get('cupsweep.pin.'+SWEEP_ID) !== S.meta.pinHash) isOrg = false;
    checkAnnouncements();
    if (editing()) pendingRender = true; else render();
  }, err => {
    root.innerHTML = `<div class="wrap">${heroShell("Flemington · Tuesday 3 November", "", false)}<section class="panel"><h2>Can’t read the sweep</h2><p>${esc(/permission/i.test(err.message) ? 'The Firebase rules don’t allow reading /cupsweep. Add the rule from the setup notes.' : err.message)}</p></section></div>`;
  });
})();
</script>
</body>
</html>
